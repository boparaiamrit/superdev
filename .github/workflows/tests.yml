name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python --version && node --version && git --version
      # superdev.zip holds exactly what plugins/superdev holds.
      - run: python tools/build_zip.py --check
      # The plugin's files and counts, the project-scoped installer, and the done check against
      # stand-ins of the Navree CLI and cargo.
      - run: python -m unittest discover -s tests
